<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chem Quest: Collect the Puzzle</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b1b3a;--gold:#ffd23f;--red:#e8383d;--cream:#fff4d6;color-scheme:light;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{font-family:'Press Start 2P',ui-monospace,monospace;font-size:11px;line-height:1.8;color:#fff;overflow-x:hidden;touch-action:manipulation}
#stage{position:relative;min-height:100dvh;padding:64px 16px 24px;padding-top:calc(64px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;transition:background .6s;animation:in .5s}
@keyframes in{from{opacity:0;transform:scale(.97)}}
.hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:center;align-items:center;gap:8px;padding:8px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:rgba(27,27,58,.85);border-bottom:4px solid var(--gold)}
.hud span{font-size:9px;color:var(--gold);margin-right:6px}
.slot{width:26px;height:26px;border:3px dashed #6a6a9a}
.slot.full{border:3px solid #fff;background:var(--c);box-shadow:0 0 12px var(--c);animation:pop .4s steps(4)}
@keyframes pop{50%{transform:scale(1.5)}}
.ttl{font-size:clamp(13px,3.4vw,20px);line-height:1.5;text-align:center;margin:6px 0 8px;text-shadow:3px 3px 0 var(--navy),-1px -1px 0 var(--navy),1px -1px 0 var(--navy),-1px 1px 0 var(--navy)}
.band{width:100vw;background:rgba(27,27,58,.8);padding:12px 18px;text-align:center;margin-bottom:14px;border-block:3px solid var(--gold)}
.msg{min-height:22px;color:#ffe45e;text-shadow:2px 2px 0 var(--navy);text-align:center;margin-top:8px}
button{font:inherit;font-size:10px;color:var(--navy);background:var(--gold);border:4px solid var(--navy);box-shadow:4px 4px 0 var(--navy);padding:10px 14px;cursor:pointer;line-height:1.6;text-align:center}
button:hover:not(:disabled){transform:translateY(-3px)}
button:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--navy)}
button:focus-visible,.gate:focus-visible{outline:4px solid #2ec4b6;outline-offset:3px}
button:disabled{opacity:.5}
.big{font-size:13px;padding:14px 20px;animation:glowb 1s infinite alternate}
@keyframes glowb{to{box-shadow:4px 4px 0 var(--navy),0 0 24px 6px var(--gold)}}
.shake{animation:shake .4s steps(8)!important}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
/* bridge */
.eq{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 6px;font-size:13px;text-shadow:2px 2px 0 var(--navy);margin-bottom:10px}
.num{display:flex;flex-direction:column;align-items:center}
.num b{cursor:pointer;color:var(--gold);padding:2px 10px;user-select:none}
.num span{background:#fff;color:var(--navy);min-width:48px;text-align:center;padding:6px;border:4px solid var(--navy);font-size:14px}
.world{position:relative;width:100vw;height:230px;margin-top:auto}
.river{position:absolute;left:0;right:0;bottom:0;height:70px;background:repeating-linear-gradient(90deg,#2a8de8 0 20px,#5db4ff 20px 40px);animation:flow 1s steps(4) infinite}
@keyframes flow{to{background-position:40px 0}}
.cliff{position:absolute;bottom:0;width:30%;height:120px;background:#7a5230;border-top:10px solid #4caf50}
.cliff.l{left:0}.cliff.r{right:0}
.plank{position:absolute;left:30%;bottom:120px;width:40%;height:14px;background:#b5651d;border:3px solid var(--navy);transform-origin:left bottom;transform:rotate(-78deg);transition:transform 1.3s steps(10)}
.plank.down{transform:rotate(0)}
.hero{position:absolute;left:10%;bottom:130px;font-size:64px;transition:left 1.6s steps(16)}
.hero.go{left:80%}
/* colors */
.lants{display:flex;gap:min(10vw,70px);margin:4px 0 10px}
.orb{width:58px;height:58px;border-radius:50%;background:#444;border:4px solid #000;transition:.4s;position:relative}
.orb::before{content:'';position:absolute;left:50%;bottom:100%;width:4px;height:40px;background:#aaa}
.orb.on{background:var(--c);box-shadow:0 0 0 8px rgba(255,255,255,.35),0 0 40px 18px var(--c)}
.pal{margin-top:auto}
.sw{width:64px;height:64px;border-radius:50%;background:var(--c);padding:0;border:5px solid #fff;box-shadow:0 0 0 4px var(--navy)}
/* gates */
.gates{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;width:min(1000px,100%)}
.gate{flex:1 1 200px;max-width:230px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center}
.door{font-size:60px;line-height:1.1;transition:.3s}
.gate:hover .door{transform:scale(1.15)}
.sign{background:#8a5a2b;border:4px solid var(--navy);padding:8px;color:#fff;margin-top:4px;font-size:9px;line-height:1.7}
.sign b{color:var(--gold);display:block}
.gate.good .door{filter:drop-shadow(0 0 16px var(--gold))}
.gate.bad{pointer-events:none;filter:grayscale(1);opacity:.7}
#hero{position:absolute;bottom:14px;left:calc(50% - 32px);font-size:64px;transition:transform 1.3s ease-in-out;z-index:5}
/* dragon */
.dragon{display:flex;align-items:center;gap:12px;max-width:760px;width:100%;margin-bottom:14px}
.d{font-size:min(22vw,110px);line-height:1;animation:bob 2s ease-in-out infinite}
.d.happy{animation:hop .5s steps(4) 3}
@keyframes hop{50%{transform:translateY(-18px) rotate(-8deg)}}
.d.fire::after{content:'🔥🔥';position:absolute;font-size:44px;animation:in .3s}
.bubble{background:#fff;color:var(--navy);border:4px solid var(--navy);padding:12px;flex:1;position:relative}
.bubble::before{content:'';position:absolute;left:-14px;top:24px;border:10px solid transparent;border-right:12px solid var(--navy)}
.chests{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.chest{width:140px;text-align:center;cursor:pointer;animation:bob 2s ease-in-out infinite}
.chest:nth-child(2n){animation-delay:.5s}
@keyframes bob{50%{transform:translateY(-8px)}}
.chest i{display:block;font-size:46px;font-style:normal}
.chest span{display:block;background:var(--navy);padding:6px;margin-top:2px;border:3px solid var(--gold)}
.chest.bad{filter:grayscale(1);pointer-events:none;opacity:.6}
.chip{background:#fff}
.chip.on{background:var(--gold);transform:scale(1.06)}
.q{margin:12px 0 4px;text-shadow:2px 2px 0 var(--navy);text-align:center}
/* IR */
.cage{height:100px;width:min(320px,80vw);border:5px solid #222;background:repeating-linear-gradient(90deg,#222 0 7px,transparent 7px 30px);display:grid;place-items:center;font-size:64px;transition:transform 1.3s steps(8),opacity 1.3s}
.cage.open{transform:translateY(-60px);opacity:.1}
.ir{display:flex;justify-content:space-between;width:min(760px,100%);margin-top:30px}
.col{display:flex;flex-direction:column;gap:26px}
.tok{touch-action:none;cursor:grab;user-select:none}
.tok.done{background:var(--c)}
#wire{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
/* puzzle */
.pz{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0 30px}
.pp{background:#2a4d9b;border:4px solid var(--navy);padding:18px 14px;text-align:center;border-radius:6px 22px 22px 6px}
.pp.r{background:#5b3a9b;border-radius:22px 6px 6px 22px}
.gap{min-width:150px;min-height:82px;border:4px dashed var(--gold);display:grid;place-items:center;margin:0 -4px;text-align:center;padding:6px;animation:glowb 1s infinite alternate}
.gap.fit{border-style:solid;background:var(--gold);color:var(--navy);animation:pop .4s steps(4)}
.frag{touch-action:none;cursor:grab;user-select:none;background:#fff;color:var(--navy);border:4px solid var(--navy);border-radius:22px 6px 6px 22px;padding:14px;text-align:center;min-width:130px;box-shadow:4px 4px 0 var(--navy);position:relative;z-index:6}
.frag.back{transition:transform .4s}
/* piece fly */
.pc{width:64px;height:64px;background:var(--c);border:4px solid #fff;border-radius:10px;display:grid;place-items:center;font-size:24px;color:var(--navy)}
.pc.fly{position:fixed;left:calc(50% - 32px);top:36%;z-index:50;transform:scale(0);transition:transform .8s cubic-bezier(.3,1.5,.5,1)}
.pc.fly.show{transform:scale(1.9)}
.pc.fly.go{transition:transform .8s ease-in}
.glow{position:absolute;inset:-80px;z-index:-1;background:radial-gradient(circle,#fffbd0 0,var(--gold) 35%,rgba(255,210,63,0) 70%);animation:pulse .6s steps(4) infinite alternate}
@keyframes pulse{to{transform:scale(1.3)}}
/* final */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(560px,92vw);height:min(280px,50vw);margin:20px auto;padding:10px;border:6px solid var(--gold);box-shadow:0 0 40px 10px rgba(255,210,63,.5);background:rgba(255,255,255,.06)}
.board i{border:3px dashed rgba(255,255,255,.45)}
#stage{z-index:1}
#live{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#live i{position:absolute;display:block}
#live .sun,#live .moon,#live .cl,#live .stars{display:none}
#live.d .sun,#live.d .cl,#live.f .sun{display:block}
#live.n .moon,#live.n .stars,#live.f .stars{display:block}
.sun{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,#fff7b0 30%,#ffd23f 60%,rgba(255,210,63,0) 72%);right:10%;top:12%;box-shadow:0 0 80px 30px rgba(255,210,63,.6);animation:pulse 2s ease-in-out infinite alternate}
.moon{width:90px;height:90px;border-radius:50%;background:#fffbe0;box-shadow:inset -18px -6px 0 #d9d2a8,0 0 60px 18px rgba(255,255,220,.5);right:12%;top:12%;animation:bob 4s ease-in-out infinite}
.cl{height:46px;width:140px;background:#fff;border-radius:50px;opacity:.92;top:18%;left:-250px;animation:drift 42s linear infinite}
.cl::before,.cl::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cl::before{width:60px;height:60px;left:20px;top:-28px}.cl::after{width:46px;height:46px;left:75px;top:-18px}
.c2{top:34%;animation-duration:64s;animation-delay:-22s;scale:.7}.c3{top:8%;animation-duration:80s;animation-delay:-50s;scale:.5}
@keyframes drift{to{transform:translateX(calc(100vw + 500px))}}
.hill{left:-5%;right:-5%;bottom:-24px;height:30vh;border-radius:50% 50% 0 0/100% 100% 0 0;background:var(--h1,#6fbf5f);animation:sway 8s ease-in-out infinite alternate}
.hill.h2{height:40vh;left:-20%;right:20%;background:var(--h2,#4aa04a);animation-duration:11s}
@keyframes sway{to{transform:translateX(40px)}}
.blob{width:50vmax;height:50vmax;border-radius:50%;filter:blur(70px);opacity:.35;animation:wander 14s ease-in-out infinite alternate}
.b1{background:#ff8fab;left:-10%;top:-15%}.b2{background:#6aa6ff;right:-15%;bottom:-10%;animation-delay:-7s}
@keyframes wander{to{transform:translate(20vw,12vh) scale(1.2)}}
.stars{position:absolute;inset:0}
.stars span{position:absolute;width:3px;height:3px;background:#fff;animation:tw 2s infinite alternate}
@keyframes tw{to{opacity:.1;transform:scale(2.2)}}
.hv{display:inline-block;width:1em;height:1.25em;vertical-align:bottom}
.hv svg,.hv img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}
.orbg{transform-box:fill-box;transform-origin:center;animation:pulse .7s ease-in-out infinite alternate}
.hero{animation:bob 1s steps(2) infinite}
.cl{width:160px;height:64px;background:linear-gradient(#fff 0 70%,#c9e4ff 70%);clip-path:polygon(0 100%,0 50%,12.5% 50%,12.5% 25%,25% 25%,25% 0,62.5% 0,62.5% 25%,75% 25%,75% 50%,100% 50%,100% 100%);border-radius:0;animation-timing-function:steps(150)}
.cl::before,.cl::after{display:none}
.sun{width:112px;height:112px;border-radius:0;box-shadow:none;background:linear-gradient(135deg,#fff6a8 0 30%,#ffd23f 30% 70%,#ff9f1c 70%);clip-path:polygon(25% 0,75% 0,75% 12.5%,87.5% 12.5%,87.5% 25%,100% 25%,100% 75%,87.5% 75%,87.5% 87.5%,75% 87.5%,75% 100%,25% 100%,25% 87.5%,12.5% 87.5%,12.5% 75%,0 75%,0 25%,12.5% 25%,12.5% 12.5%,25% 12.5%);animation:bob 2s steps(4) infinite}
.moon{width:96px;height:96px;border-radius:0;box-shadow:none;background:linear-gradient(135deg,#fffbe0 0 55%,#cfc89a 55%);clip-path:polygon(25% 0,75% 0,75% 12.5%,87.5% 12.5%,87.5% 25%,100% 25%,100% 75%,87.5% 75%,87.5% 87.5%,75% 87.5%,75% 100%,25% 100%,25% 87.5%,12.5% 87.5%,12.5% 75%,0 75%,0 25%,12.5% 25%,12.5% 12.5%,25% 12.5%);animation:bob 4s steps(4) infinite}
.hill{border-radius:0;height:34vh;background-color:var(--h1,#6fbf5f);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 32px,transparent 32px 64px);clip-path:polygon(0 100%,0 70%,8% 70%,8% 50%,16% 50%,16% 30%,28% 30%,28% 15%,44% 15%,44% 30%,56% 30%,56% 50%,68% 50%,68% 65%,80% 65%,80% 45%,92% 45%,92% 70%,100% 70%,100% 100%);animation:sway 10s steps(10) infinite alternate}
.hill.h2{height:44vh;background-color:var(--h2,#4aa04a);clip-path:polygon(0 100%,0 55%,12% 55%,12% 35%,24% 35%,24% 20%,40% 20%,40% 40%,52% 40%,52% 60%,70% 60%,70% 40%,85% 40%,85% 55%,100% 55%,100% 100%);animation-duration:14s}
.blob{display:none}
.hv{width:1em;height:1.3em}
.pxs{width:min(46vw,210px);flex:none;font-size:0}
.pxs svg{width:100%;height:auto;display:block}
#live .mtn{display:none}
#live.m .mtn,#live.m .cl{display:block}
.mtn{left:4%;right:4%;bottom:18vh;height:68vh;background:linear-gradient(#f6fcff 0 20%,#d3e6f0 20% 28%,#9bbfd0 28% 45%,#6f9bb3 45% 70%,#4c7a94 70%);clip-path:polygon(0 100%,0 90%,8% 90%,8% 80%,16% 80%,16% 68%,24% 68%,24% 56%,32% 56%,32% 44%,40% 44%,40% 30%,46% 30%,46% 16%,54% 16%,54% 30%,60% 30%,60% 44%,68% 44%,68% 56%,76% 56%,76% 68%,84% 68%,84% 80%,92% 80%,92% 90%,100% 90%,100% 100%)}
#live.m .hill{background-image:repeating-conic-gradient(rgba(0,0,0,.2) 0 25%,transparent 0 50%);background-size:16px 16px}
#live.g::after{display:none}
.cliff{height:140px;border-top:none;background:linear-gradient(#5fae3a 0 12px,#3f8a2a 12px 18px,#e3b96f 18px 58px,#c99552 58px 64px,#8a4b2a 64px)}
.cliff::after{content:'';position:absolute;left:0;right:0;top:64px;bottom:0;background:repeating-linear-gradient(90deg,rgba(40,20,10,.55) 0 3px,transparent 3px 36px),repeating-linear-gradient(0deg,rgba(40,20,10,.55) 0 3px,transparent 3px 24px)}
.hero{bottom:140px;font-size:76px}
.num input{width:72px;font:inherit;font-size:18px;text-align:center;padding:10px 4px;border:4px solid var(--navy);box-shadow:4px 4px 0 var(--navy);background:#fff;color:var(--navy);-moz-appearance:textfield}
.num input::-webkit-inner-spin-button,.num input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.num input:focus{outline:4px solid var(--gold);outline-offset:2px}
.plank{bottom:140px}
#hero{font-size:76px;left:calc(50% - 38px)}
.stars span{width:4px;height:4px;animation-timing-function:steps(2)}
#live::after{content:'';position:absolute;left:0;right:0;bottom:0;height:56px;border-top:8px solid var(--h1,#6fbf5f);background:repeating-linear-gradient(90deg,rgba(0,0,0,.45) 0 4px,transparent 4px 56px),repeating-linear-gradient(0deg,rgba(0,0,0,.45) 0 4px,transparent 4px 28px),var(--h2,#4aa04a)}
#fit>*{animation:drop .7s cubic-bezier(.3,1.7,.5,1) backwards}
#fit>*:nth-child(2){animation-delay:.1s}#fit>*:nth-child(3){animation-delay:.2s}#fit>*:nth-child(4){animation-delay:.3s}#fit>*:nth-child(5){animation-delay:.4s}
@keyframes drop{from{transform:translateY(-60px) scale(.7);opacity:0}}
.ttl{animation:wig 2.4s ease-in-out infinite}
@keyframes wig{50%{transform:rotate(-1.2deg) scale(1.04)}}
.hero{animation:bob 1s ease-in-out infinite}
.sw:hover:not(:disabled){animation:none;transform:scale(1.2) rotate(10deg)}
.sw{animation:bob 2.4s ease-in-out infinite}.sw:nth-child(2n){animation-delay:.4s}
.gate .door{animation:bob 2s ease-in-out infinite}.gate:nth-child(2n) .door{animation-delay:.5s}
#fx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:2}
#fx span{position:absolute;bottom:-60px;opacity:.35;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(360deg)}}
.mute{position:absolute;right:10px;padding:3px 8px;font-size:14px;box-shadow:none}
.cf{position:fixed;left:50vw;top:36vh;width:10px;height:14px;z-index:60;pointer-events:none;animation:burst 1.6s ease-out forwards}
@keyframes burst{40%{transform:translate(calc(var(--dx)*.7),var(--up)) rotate(calc(var(--r)*.5))}to{transform:translate(var(--dx),60vh) rotate(var(--r));opacity:0}}
.spk{position:fixed;z-index:80;pointer-events:none;color:var(--gold);font-size:16px;animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.flash{position:fixed;inset:0;background:#fff;z-index:55;pointer-events:none;animation:fl .6s forwards}
@keyframes fl{from{opacity:.7}to{opacity:0}}
.cheer{position:fixed;top:16%;left:0;right:0;text-align:center;font-size:clamp(22px,7vw,46px);color:#ffe45e;text-shadow:4px 4px 0 #1b1b3a;z-index:70;pointer-events:none;animation:cheer 1.4s forwards}
@keyframes cheer{0%{transform:scale(0) rotate(-12deg)}30%{transform:scale(1.25) rotate(4deg)}100%{transform:scale(1) translateY(-50px);opacity:0}}
.pxs{width:240px;flex:none;font-size:0}
.pxi{width:100%;display:block;image-rendering:pixelated}
@media (max-width:520px){.pxs{width:160px}}
.world{height:250px}
.cliff{width:36%}
.plank{left:36%;width:0;height:14px;transform:none;transition:width 1.3s steps(10)}
.plank.down{width:28%}
.pzw{position:relative;margin:6px auto 0}
.pzb{position:absolute;left:0;top:0;outline:4px dashed var(--gold);background:rgba(255,255,255,.1)}
.pzb::before{content:'';position:absolute;inset:0;background:var(--img) 0 0/100% 100%;opacity:.18}
.pc2{position:absolute;touch-action:none;cursor:grab;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5));transition:transform .15s}
.pc2.ok{cursor:default;filter:none}
.pi{position:absolute;inset:0;background-image:var(--img);background-repeat:no-repeat}
.ol{position:absolute;inset:0;pointer-events:none;overflow:visible}
.ol path{fill:none;stroke:#fff;stroke-width:2;stroke-linejoin:round}
.pzw.done .ol path{opacity:0}
.pzw.done .pzb{outline-color:#7bd389}
.term{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.world{height:270px}
.cliff{width:calc(50% - 110px)}
.plank{left:calc(50% - 110px);width:220px;height:14px;transform:rotate(-28deg);transform-origin:left bottom;transition:transform 1.3s steps(10)}
.plank.down{width:220px;transform:rotate(0)}
.hero{left:max(8px,calc(50% - 200px))}
.hero.go{left:calc(50% + 130px)}
#live .mtn{display:none}
#live.c .sun,#live.c .mtn{display:block}
#live.c .mtn{background:linear-gradient(#7a1414 0 25%,#5a0c0c 25%)}
#live.c .hill{background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 32px,transparent 32px 64px)}
.hud{flex-wrap:wrap}
.snd{order:9;margin-left:auto;display:flex;gap:6px}
.snd button{padding:3px 7px;font-size:15px;box-shadow:none;line-height:1.3}
.snd button.off{background:linear-gradient(135deg,transparent 44%,#e8383d 44% 56%,transparent 56%),var(--gold);filter:grayscale(.7);opacity:.7}
.ttl{margin:12px 0 26px;line-height:1.7}
.band{margin:0 0 34px;padding:18px 20px;line-height:2}
.eq{margin-bottom:28px}
.lants{margin:26px 0 30px}
.dragon{margin-bottom:30px}
.gates{margin-top:8px}
.q{margin:22px 0 10px}
.ir{margin-top:44px}
.pz{margin:24px 0 36px}
.msg{margin-top:18px}
html,body{height:100%;overflow:hidden}
#stage{height:100dvh;min-height:0;overflow:hidden;padding:0;display:block}
#fit{position:absolute;left:0;top:var(--hud,52px);transform-origin:0 0;display:flex;flex-direction:column;align-items:center;padding:10px 16px;box-sizing:border-box;width:100vw}
.band,.world{width:100%}
.hint{position:fixed;bottom:12px;left:0;right:0;margin:auto;width:max-content;max-width:92vw;z-index:30;background:var(--navy);color:var(--gold);border:3px solid var(--gold);padding:8px 14px;font-size:10px;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}

  if(!AC||!SND.music||!SND.started)return;
  const bus=mbus();
  if(SND.until){if(AC.currentTime<SND.until)return;SND.until=0;SND.step=0;SND.t=AC.currentTime+.05;bus.gain.setValueAtTime(1,AC.currentTime)}
  if(SND.t<AC.currentTime)SND.t=AC.currentTime+.05;
  while(SND.t<AC.currentTime+.4){const i=SND.step%32,o=SND.t-AC.currentTime,r=ROOT[i>>3],j=i%8;
    if(LEAD[i])tone(LEAD[i],o,.17,'square',.03,0,bus);
    tone(j%2?r*2:r,o,.16,'triangle',.07,0,bus);
    if(j%4==0)tone(150,o,.12,'sine',.12,45,bus);
    if(j%4==2)noise(o,.09,.05,1500,bus);
    if(j%2)noise(o,.03,.02,6000,bus);
    SND.step++;SND.t+=.2}
},100);
[['#bm','music'],['#bc','click'],['#br','result']].forEach(([id,k])=>{const b=$(id);b.onclick=()=>{SND[k]=!SND[k];b.classList.toggle('off',!SND[k]);if(k=='music'&&SND[k]&&AC)SND.t=AC.currentTime+.1}});
const hint=add('hint','♪ Click anywhere to start the music');
function go(){if(AC&&AC.state==='running'&&!SND.started){SND.started=1;SND.t=AC.currentTime+.1;hint.remove()}}
function startAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.onstatechange=go;AC.resume&&AC.resume().then(go).catch(()=>{});go()}catch(e){}}
['keydown','touchstart'].forEach(ev=>addEventListener(ev,startAudio,{passive:true}));
startAudio();
const stages=[bridge,colors,zimm,dragon,ir,c13,twins,nmr];
let TI=0;
let FIT=1;
function fitNow(){const f=$('#fit'),top=$('#hud').offsetHeight,avail=innerHeight-top;
  st.style.setProperty('--hud',top+'px');f.style.transform='none';f.style.width='100vw';f.style.height='auto';
  const h=f.scrollHeight;FIT=Math.max(.4,Math.min(1,avail/h));
  f.style.width=(100/FIT)+'vw';f.style.height=(avail/FIT)+'px';f.style.transform=`scale(${FIT})`}
addEventListener('resize',fitNow);addEventListener('load',fitNow);if(document.fonts)document.fonts.ready.then(fitNow);
const maxRun=o=>{let m=1,c=1;for(let i=1;i<o.length;i++){c=(o[i]>3)===(o[i-1]>3)?c+1:1;m=Math.max(m,c)}return m};
let ORD;do{ORD=[0,1,2,3,4,5,6,7].sort(()=>Math.random()-.5)}while(maxRun(ORD)>2);
function next(){$('#prog').textContent=got+'/8 pieces';window.scrollTo(0,0);if(got>=8){TI=1;final()}else{TI=ORD[got];stages[TI]()}}

function bridge(){
  const n=(l)=>`<span class="term"><div class="num"><input type="number" inputmode="numeric" min="0" max="99" placeholder="?" aria-label="coefficient"></div>${l}</span>`;
  scene(T('Lower the bridge','Balance the equation. The numbers are the code.')+
  `<div class="eq">Cr₂O₇²⁻ + ${n('H⁺ +')} ${n('Fe²⁺ →')} ${n('Cr³⁺ +')} ${n('H₂O +')} ${n('Fe³⁺')}</div>
  <button class="big" id="go">Lower the bridge</button><div class="msg" id="msg"></div>
  <div class="world"><div class="river"></div><div class="cliff l"></div><div class="cliff r"></div><div class="plank" id="pl"></div><div class="hero" id="hr">${WIZ}</div></div>`);
  st.querySelectorAll('.num input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')$('#go').click()});
  $('#go').onclick=()=>{
    const v=[...st.querySelectorAll('.num input')].map(i=>i.value===''?-1:+i.value);
    if(v.join()===ANS.bridge.join()){$('#go').disabled=true;$('#pl').classList.add('down');setTimeout(()=>$('#hr').classList.add('go'),1300);msg('');setTimeout(win,3600)}
    else{shake($('.eq'));msg('Wrong code. Check atoms and charges.')}
  };
}

function colors(){
  const Q0=['What color does starch make with I₂?','What color does thiosulfate make with iron (Fe³⁺)?','What color does chloroform make with I₂?'];
  let ord;do{ord=[0,1,2].sort(()=>Math.random()-.5)}while(ord.join()=='0,1,2');const Q=ord.map(i=>Q0[i]),A=ord.map(i=>ANS.colors[i]);const C=[['blue','#2b59e0'],['red','#e8383d'],['violet','#8a3ffc'],['green','#2fa84f'],['yellow','#ffd23f']];let k=0;
  scene(T('Light the lanterns')+`<div class="lants">${A.map((c,i)=>`<div class="orb" id="o${i}" style="--c:${C.find(x=>x[0]===c)[1]}"></div>`).join('')}</div><div class="band" id="q"></div><div class="msg" id="msg"></div><div class="row pal" id="ch"></div>`);
  const show=()=>{$('#q').textContent=Q[k];$('#ch').innerHTML='';
    [...C].sort(()=>Math.random()-.5).forEach(([n,h])=>{const b=document.createElement('button');b.className='sw';b.style.setProperty('--c',h);b.setAttribute('aria-label',n);
      b.onclick=()=>{if(n===A[k]){$('#o'+k).classList.add('on');k++;msg('');if(k===3){$('#ch').innerHTML='';$('#q').textContent='All lanterns are lit!';setTimeout(win,1300)}else show()}else{shake(b);msg('Not that color. Try again.')}};
      $('#ch').appendChild(b)})};show();
}

function gatesQ(title,q,opts,ok){
  scene(T(title,q)+`<div class="gates">${opts.map((o,i)=>`<div class="gate" tabindex="0" role="button" data-i="${i}"><div class="door">🚪</div><div class="sign"><b>Path ${'ABCD'[i]}</b>${o}</div></div>`).join('')}</div><div class="msg" id="msg"></div><div style="height:90px"></div><div id="hero">${WIZ}</div>`);
  const hero=$('#hero');
  st.querySelectorAll('.gate').forEach(g=>{
    const pick=()=>{
      const door=g.querySelector('.door'),[dx,dy]=ctr(door),[hx,hy]=ctr(hero);
      if(+g.dataset.i===ok){st.querySelectorAll('.gate').forEach(x=>x.style.pointerEvents='none');hero.style.transform=`translate(${(dx-hx)/FIT}px,${(dy-hy)/FIT}px)`;
        setTimeout(()=>{door.textContent='✨';g.classList.add('good')},1300);setTimeout(win,2300)}
      else{g.classList.add('bad');hero.style.transform=`translate(${(dx-hx)*.6/FIT}px,${(dy-hy)*.6/FIT}px)`;door.textContent='💥';
        setTimeout(()=>hero.style.transform='',900);msg('Dead end! Pick another path.')}
    };
    g.onclick=pick;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}};
  });
}
function zimm(){gatesQ('Choose the right path','Titrating Fe²⁺ with KMnO₄ using diphenylamine indicator: why add Zimmermann’s reagent?',['To elevate or increase the E° of Fe','To decrease the E° of Fe','To activate the indicator','To make the endpoint color more noticeable'],ANS.zimm)}
function c13(){gatesQ('The path of truth (¹³C NMR)','Which of these sentences is true?',['¹³C is more common than ¹²C','A quartet C signal means a tertiary carbon','It appears in a broader range than ¹H NMR','It identifies both type and number of carbons'],ANS.c13)}

function dragonScene(title,riddle,body){
  scene(T(title)+`<div class="dragon"><div class="d pxs" id="dg">${DRG2}</div><div class="bubble" id="bb">${riddle}</div></div>${body}<div class="msg" id="msg"></div>`);
}
const wrongD=t=>{const d=$('#dg');shake(d);$('#bb').textContent=t};
const winD=t=>{$('#dg').classList.add('happy');$('#bb').textContent=t;setTimeout(win,2000)};
function dragon(){
  dragonScene('The dragon’s riddle','What is the substance that, by oxidation, we can breathe, and by reduction, we can drink?',
  `<div class="chests">${['H₂O₂','Na₂O₂','CaSO₄','KMnO₄'].map((x,i)=>`<div class="chest" tabindex="0" role="button" data-i="${i}"><i>📦</i><span>${'abcd'[i]}) ${x}</span></div>`).join('')}</div>`);
  st.querySelectorAll('.chest').forEach(c=>{const f=()=>{
    if(+c.dataset.i===ANS.dragon){st.querySelectorAll('.chest').forEach(x=>x.style.pointerEvents='none');c.querySelector('i').textContent='🎁';winD('Correct! O₂ when oxidized, H₂O when reduced. Pass!')}
    else{c.classList.add('bad');wrongD('🔥 Wrong! Try another chest.')}};
    c.onclick=f;c.onkeydown=e=>{if(e.key==='Enter')f()}});
}

function ir(){
  const S=['3500 – 2500','3300','1650 – 1600'],B=['≡C–H','C=C','COOH'];let n=0;
  scene(T('Break the cage (IR)','Drag a wire from each signal (cm⁻¹) to the bond that releases it.')+
  `<div class="cage" id="cg">${WIZ}</div><div class="ir"><div class="col">${S.map((s,i)=>`<button class="tok" data-s="${i}">${s}</button>`).join('')}</div><div class="col">${B.map((s,i)=>`<button data-b="${i}">${s}</button>`).join('')}</div></div><div class="msg" id="msg"></div>`);
  const svg=$('#wire');
  st.querySelectorAll('[data-s]').forEach(b=>b.onpointerdown=e=>{
    if(b.classList.contains('done'))return;e.preventDefault();
    const [x1,y1]=ctr(b),l=document.createElementNS('http://www.w3.org/2000/svg','line');
    ['x1',x1,'y1',y1,'x2',x1,'y2',y1,'stroke',COL[+b.dataset.s*2+1],'stroke-width',8,'stroke-linecap','round'].reduce((k,v,i,a)=>{if(i%2==0)l.setAttribute(v,a[i+1]);return 0},0);
    svg.appendChild(l);
    const mv=ev=>{l.setAttribute('x2',ev.clientX);l.setAttribute('y2',ev.clientY)};
    const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);
      const t=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-b]');
      if(t&&!t.classList.contains('done')&&ANS.ir[+b.dataset.s]===+t.dataset.b){const [a,c]=ctr(t);l.setAttribute('x2',a-t.offsetWidth/2);l.setAttribute('y2',c);
        [b,t].forEach(x=>{x.classList.add('done');x.style.setProperty('--c',COL[+b.dataset.s*2+1])});msg('');
        if(++n===3){$('#cg').classList.add('open');setTimeout(win,1800)}}
      else{l.remove();if(t){shake(t);msg('Wrong wire. Try another bond.')}}};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);
  });
}

function twins(){
  const G=[['What phenomenon is this?',['Isotopes in mass spectrometry','Chemical shift in NMR','Spin–spin splitting','IR overtones'],0],
  ['Twin 1 (side by side) resembles…',['Br — 1:1','Br — 3:1','Cl — 1:1','Cl — 3:1'],0],['Twin 2 (3 steps apart) resembles…',['Br — 1:1','Br — 3:1','Cl — 1:1','Cl — 3:1'],3]],pick=[-1,-1,-1];
  dragonScene('The twin riddle','Two sets of twins stand before you. Pair 1 is side by side. In pair 2, one stands in front of the other with 3 steps between.',
  G.map((g,r)=>`<div class="q">${g[0]}</div><div class="row">${g[1].map((o,i)=>`<button class="chip" data-r="${r}" data-i="${i}">${o}</button>`).join('')}</div>`).join('')+`<div class="row" style="margin-top:16px"><button class="big" id="go">Answer the dragon</button></div>`);
  st.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const r=+b.dataset.r;st.querySelectorAll(`[data-r="${r}"]`).forEach(x=>x.classList.remove('on'));b.classList.add('on');pick[r]=+b.dataset.i});
  $('#go').onclick=()=>{if(pick.every((p,i)=>p===G[i][2])){$('#go').disabled=true;winD('Correct! Br gives M and M+2 at 1:1. Cl gives 3:1.')}else wrongD('🔥 Not quite. Think about M and M+2 peaks.')};
}

function nmr(){
  const O=[['A','Linear propyl','CH₃CH₂CH₂–X'],['B','tert-Butyl','(CH₃)₃C–X'],['C','Isopropyl','(CH₃)₂CH–X'],['D','Ethyl','CH₃CH₂–X']];
  scene(T('¹H NMR completes the puzzle','Drag the fragment that fits the gap.')+
  `<div class="pz"><div class="pp">δ ≈ 1.2 ppm<br>doublet, 6H</div><div class="gap" id="gp">?</div><div class="pp r">δ ≈ 3.7 ppm<br>septet, 1H</div></div>
  <div class="row">${O.map((o,i)=>`<div class="frag" data-i="${i}">${o[0]}. ${o[1]}<br>${o[2]}</div>`).join('')}</div><div class="msg" id="msg"></div>`);
  st.querySelectorAll('.frag').forEach(f=>f.onpointerdown=e=>{
    e.preventDefault();f.classList.remove('back');const sx=e.clientX,sy=e.clientY;let dx=0,dy=0;
    const mv=ev=>{dx=ev.clientX-sx;dy=ev.clientY-sy;f.style.transform=`translate(${dx/FIT}px,${dy/FIT}px)`};
    const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);
      const g=$('#gp').getBoundingClientRect(),moved=Math.hypot(dx,dy)>8,inside=ev.clientX>g.left&&ev.clientX<g.right&&ev.clientY>g.top&&ev.clientY<g.bottom;
      if(inside||!moved){if(+f.dataset.i===ANS.nmr){st.querySelectorAll('.frag').forEach(x=>x.style.pointerEvents='none');f.remove();$('#gp').textContent=O[ANS.nmr][1];$('#gp').classList.add('fit');setTimeout(win,1400);return}msg('It doesn’t fit. Try another piece.');shake($('#gp'))}
      f.classList.add('back');f.style.transform=''};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);
  });
}

function finalOld(){
  $('#prog').textContent='8/8 pieces';
  scene(T('You collected every piece!','The puzzle board is ready. Assemble it together here.')+`<div class="board" aria-label="Empty puzzle board">${'<i></i>'.repeat(8)}</div>`);
  document.body.style.background=BG[1];document.body.style.backgroundAttachment='fixed';
}
next();
</script></body></html>
